<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Toki</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <div class="brand">
        <span class="brand-kanji">時</span>
        <span class="brand-name">Toki</span>
      </div>
      <div class="user-area">
        <span id="user-email"></span>
        <button id="sign-in" type="button">Entrar com Google</button>
        <button id="sign-out" type="button" hidden>Sair</button>
      </div>
    </header>

    <main>
      <div class="prompt-box">
        <textarea
          id="question"
          rows="2"
          placeholder="email ou nome de alguém"
        ></textarea>
        <button id="ask" type="button" class="prompt-send" aria-label="Consultar">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <polyline points="5 12 12 5 19 12"></polyline>
            <line x1="12" y1="5" x2="12" y2="19"></line>
          </svg>
        </button>
      </div>

      <section id="result" hidden>
        <p id="reply"></p>
        <details>
          <summary>Detalhes</summary>
          <pre id="facts"></pre>
        </details>
      </section>

      <p id="error" hidden></p>

      <details id="settings-section">
        <summary>Configurações</summary>
        <div class="time-row">
          <label for="work-start">Horário</label>
          <input id="work-start" type="number" min="0" max="23" />
          <span class="sep">até</span>
          <input id="work-end" type="number" min="1" max="24" />
          <span class="sep">h</span>
        </div>
        <div class="time-row">
          <label for="event-color">Cor dos eventos</label>
          <input id="event-color" type="color" />
          <button id="save-settings" type="button">Salvar</button>
        </div>
        <p id="settings-msg" hidden></p>
      </details>
    </main>

    <script type="module" src="popup.js"></script>
  </body>
</html>
