services:
  postgres:
    image: postgres:16
    container_name: busy-checker-pg
    environment:
      POSTGRES_USER: busy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: busy_checker
    volumes:
      - busy_pg_data:/var/lib/postgresql/data
      - ./src/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    # Not exposed on host on purpose — only reachable from the api container.
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U busy -d busy_checker"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: busy-checker-api
    environment:
      DATABASE_URL: postgres://busy:${POSTGRES_PASSWORD}@postgres:5432/busy_checker
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-PREENCHER}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      SESSION_JWT_SECRET: ${SESSION_JWT_SECRET}
      PORT: "8788"
      CORS_ORIGINS: ${CORS_ORIGINS}
      ALLOWED_HD: ${ALLOWED_HD:-}
    ports:
      - "127.0.0.1:8788:8788"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  busy_pg_data:
