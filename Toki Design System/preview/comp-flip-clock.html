<body>
<div class="stage">

<div class="row" style="gap:14px;align-items:center;">
  <div style="display:flex;gap:5px;">
    <div style="background:#fff;border:1px solid #d4d4d8;border-radius:7px;width:52px;height:60px;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:700;color:#111827;letter-spacing:-0.04em;font-variant-numeric:tabular-nums;line-height:1;box-shadow:0 1px 2px rgba(0,0,0,0.05);">14</div>
    <div style="background:#fff;border:1px solid #d4d4d8;border-radius:7px;width:52px;height:60px;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:700;color:#111827;letter-spacing:-0.04em;font-variant-numeric:tabular-nums;line-height:1;box-shadow:0 1px 2px rgba(0,0,0,0.05);">30</div>
  </div>
  <div style="display:flex;flex-direction:column;gap:4px;">
    <button style="background:transparent;border:1px solid #e5e7eb;width:24px;height:24px;border-radius:6px;padding:0;color:#6b7280;cursor:pointer;display:flex;align-items:center;justify-content:center;">
      <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>
    </button>
    <button style="background:transparent;border:1px solid #e5e7eb;width:24px;height:24px;border-radius:6px;padding:0;color:#6b7280;cursor:pointer;display:flex;align-items:center;justify-content:center;">
      <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
    </button>
  </div>
</div>
<div class="t-helper">Flip-clock card: 52 × 60, 7 px radius, 32 px tabular bold. Paired with chevron stack to step through intra-day slots.</div>

</div>
