  <div style="display:flex;align-items:baseline;gap:14px;"><span class="mono" style="width:42px;">9px</span><span style="font-size:9px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:var(--ink);">OCUPADO</span><span class="label">micro-cap tag</span></div>
