<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style></style>
</head>
<body>
<div class="stage">

<div style="position:relative;background:#fafafa;border:1px solid #e5e7eb;border-radius:8px;width:260px;height:130px;overflow:hidden;">
  <div style="position:absolute;left:30px;right:4px;top:30px;height:1px;background:rgba(0,0,0,0.05);"></div>
  <div style="position:absolute;left:30px;right:4px;top:75px;height:1px;background:rgba(0,0,0,0.05);"></div>
  <div style="position:absolute;left:4px;top:30px;width:24px;font-size:9px;color:#9ca3af;font-variant-numeric:tabular-nums;transform:translateY(-50%);letter-spacing:-0.02em;">14:00</div>
  <div style="position:absolute;left:4px;top:75px;width:24px;font-size:9px;color:#9ca3af;font-variant-numeric:tabular-nums;transform:translateY(-50%);letter-spacing:-0.02em;">15:00</div>
  <div style="position:absolute;left:30px;right:4px;top:38px;height:22px;background:#3b82f6;color:#fff;border-radius:4px;padding:2px 6px;display:flex;align-items:center;gap:5px;font-size:10px;box-shadow:0 1px 2px rgba(0,0,0,0.06);">
    <span style="font-weight:600;opacity:0.85;font-variant-numeric:tabular-nums;">14:00</span>
    <span style="font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">Standup</span>
  </div>
  <div style="position:absolute;left:30px;right:4px;top:78px;height:34px;background:transparent;border:1.5px dashed #111827;border-radius:4px;padding:3px 7px;display:flex;flex-direction:column;gap:1px;">
    <span style="font-size:10px;font-weight:600;color:#111827;letter-spacing:-0.02em;font-variant-numeric:tabular-nums;">15:00</span>
    <span style="font-size:11px;font-weight:600;color:#111827;letter-spacing:-0.01em;">Horário livre para agendamento</span>
  </div>
</div>
<div class="t-helper">Agenda mini-timeline. Events are colored blocks; the suggested free slot is a 1.5 px dashed ink rectangle with no fill.</div>

</div>
</body>
</html>
