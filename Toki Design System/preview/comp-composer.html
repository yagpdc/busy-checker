<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style></style>
</head>
<body>
<div class="stage">

<div style="width:520px;max-width:100%;background:#fafafa;border:1px solid #e5e7eb;border-radius:14px;padding:10px 10px 10px 14px;display:flex;align-items:flex-end;gap:8px;">
  <textarea placeholder="Pergunte sobre a agenda de alguém..." style="flex:1;border:0;background:transparent;font:13.5px var(--font-ui);color:#111827;outline:none;resize:none;padding:2px 0;line-height:1.4;" rows="2"></textarea>
  <button style="width:30px;height:30px;border-radius:10px;background:#111827;color:#fff;border:0;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
    <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="5 12 12 5 19 12"/><line x1="12" y1="5" x2="12" y2="19"/></svg>
  </button>
</div>
<div style="width:520px;max-width:100%;background:#fff;border:1px solid #111827;border-radius:14px;padding:10px 10px 10px 14px;display:flex;align-items:flex-end;gap:8px;box-shadow:0 0 0 4px rgba(17,24,39,0.06);">
  <textarea style="flex:1;border:0;background:transparent;font:13.5px var(--font-ui);color:#111827;outline:none;resize:none;padding:2px 0;line-height:1.4;" rows="2">tá livre o Hugo agora?</textarea>
  <button style="width:30px;height:30px;border-radius:10px;background:#111827;color:#fff;border:0;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
    <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="5 12 12 5 19 12"/><line x1="12" y1="5" x2="12" y2="19"/></svg>
  </button>
</div>
<div class="t-helper">Resting: off-white fill, gray-4 border. Focused: white fill, ink border, 4 px focus halo. 14 px radius, 13.5 px textarea.</div>

</div>
</body>
</html>
