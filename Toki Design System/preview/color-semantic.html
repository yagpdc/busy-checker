<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style></style>
</head>
<body>
<div class="stage">

<div class="col" style="gap:8px;">
  <div style="display:grid;grid-template-columns:140px 1fr 1fr;gap:8px;align-items:center;font-size:12px;">
    <span class="mono">--fg-1</span><span style="color:#111827;">Primary ink</span><span class="swatch-hex">#111827</span>
    <span class="mono">--fg-2</span><span style="color:#6b7280;">Secondary text</span><span class="swatch-hex">#6b7280</span>
    <span class="mono">--fg-3</span><span style="color:#9ca3af;">Placeholder · disabled</span><span class="swatch-hex">#9ca3af</span>
    <span class="mono">--bg</span><span>Card body · white</span><span class="swatch-hex">#ffffff</span>
    <span class="mono">--bg-sunken</span><span>Form interior</span><span class="swatch-hex">#fafafa</span>
    <span class="mono">--bg-chip</span><span>Pill chip · hover</span><span class="swatch-hex">#f3f4f6</span>
    <span class="mono">--border</span><span>Hairline · control</span><span class="swatch-hex">#e5e7eb</span>
    <span class="mono">--accent</span><span style="color:#111827;font-weight:600;">Primary fill</span><span class="swatch-hex">#111827</span>
    <span class="mono">--danger</span><span style="color:#dc2626;font-weight:600;">Error · busy tag</span><span class="swatch-hex">#dc2626</span>
  </div>
</div>

</div>
</body>
</html>
