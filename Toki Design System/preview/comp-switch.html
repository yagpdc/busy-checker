<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style></style>
</head>
<body>
<div class="stage">

<div class="row" style="gap:24px;align-items:center;">
  <label style="position:relative;width:36px;height:20px;display:inline-block;">
    <input type="checkbox" checked style="position:absolute;opacity:0;">
    <span style="position:absolute;inset:0;background:#111827;border-radius:999px;"></span>
    <span style="position:absolute;width:16px;height:16px;left:18px;top:2px;background:#fff;border-radius:50%;box-shadow:0 1px 2px rgba(0,0,0,0.15);"></span>
  </label>
  <span class="label">on · ink</span>
  <label style="position:relative;width:36px;height:20px;display:inline-block;">
    <input type="checkbox" style="position:absolute;opacity:0;">
    <span style="position:absolute;inset:0;background:#d1d5db;border-radius:999px;"></span>
    <span style="position:absolute;width:16px;height:16px;left:2px;top:2px;background:#fff;border-radius:50%;box-shadow:0 1px 2px rgba(0,0,0,0.15);"></span>
  </label>
  <span class="label">off · gray-3</span>
  <label style="position:relative;width:36px;height:20px;display:inline-block;">
    <input type="checkbox" checked style="position:absolute;opacity:0;">
    <span style="position:absolute;inset:0;background:#111827;border-radius:999px;box-shadow:0 0 0 3px rgba(17,24,39,0.12);"></span>
    <span style="position:absolute;width:16px;height:16px;left:18px;top:2px;background:#fff;border-radius:50%;box-shadow:0 1px 2px rgba(0,0,0,0.15);"></span>
  </label>
  <span class="label">focused</span>
</div>
<div class="t-helper">36 × 20 pill. Thumb is 16 × 16 with a 1 px shadow. Slide animation: 180 ms.</div>

</div>
</body>
</html>
