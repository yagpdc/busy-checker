<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style></style>
</head>
<body>
<div class="stage">

<div class="row" style="gap:14px;align-items:stretch;">
  <div class="col" style="flex:1;gap:6px;">
    <div style="height:64px;border:1px solid var(--gray-4);border-radius:8px;background:#fff;"></div>
    <span class="label">1px · gray-4 · hairline</span>
  </div>
  <div class="col" style="flex:1;gap:6px;">
    <div style="height:64px;border:1px solid var(--gray-3);border-radius:8px;background:#fff;"></div>
    <span class="label">1px · gray-3 · control</span>
  </div>
  <div class="col" style="flex:1;gap:6px;">
    <div style="height:64px;border:1.5px dashed var(--ink);border-radius:4px;background:#fff;"></div>
    <span class="label">1.5px dashed ink · slot</span>
  </div>
  <div class="col" style="flex:1;gap:6px;">
    <div style="height:64px;border:1px solid var(--ink);border-radius:8px;background:#fff;box-shadow:0 0 0 3px rgba(17,24,39,0.08);"></div>
    <span class="label">focused</span>
  </div>
</div>
<div class="row" style="gap:14px;align-items:center;">
  <div style="flex:1;height:1px;background:var(--gray-5);"></div>
  <span class="label">divider · gray-5</span>
  <div style="flex:1;height:1px;background:var(--gray-5);"></div>
</div>

</div>
</body>
</html>
