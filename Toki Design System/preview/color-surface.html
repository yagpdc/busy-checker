<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style></style>
</head>
<body>
<div class="stage">

<div class="row" style="gap:10px;">
  
<div class="swatch" style="flex:1;min-width:120px;">
  <div class="swatch-chip" style="background:#ffffff;border-color:var(--gray-4);"></div>
  <div class="swatch-meta">
    <span class="swatch-name">white · bg</span>
    <span class="swatch-hex">#ffffff</span>
  </div>
</div>
  
<div class="swatch" style="flex:1;min-width:120px;">
  <div class="swatch-chip" style="background:#fafafa;border-color:var(--gray-4);"></div>
  <div class="swatch-meta">
    <span class="swatch-name">off-white · sunken</span>
    <span class="swatch-hex">#fafafa</span>
  </div>
</div>
  
<div class="swatch" style="flex:1;min-width:120px;">
  <div class="swatch-chip" style="background:#f9fafb;border-color:var(--gray-4);"></div>
  <div class="swatch-meta">
    <span class="swatch-name">gray-6</span>
    <span class="swatch-hex">#f9fafb</span>
  </div>
</div>
  
<div class="swatch" style="flex:1;min-width:120px;">
  <div class="swatch-chip" style="background:#fef2f2;border-color:var(--gray-4);"></div>
  <div class="swatch-meta">
    <span class="swatch-name">red-bg · error</span>
    <span class="swatch-hex">#fef2f2</span>
  </div>
</div>
  
<div class="swatch" style="flex:1;min-width:120px;">
  <div class="swatch-chip" style="background:#f0fdf4;border-color:var(--gray-4);"></div>
  <div class="swatch-meta">
    <span class="swatch-name">green-bg · success</span>
    <span class="swatch-hex">#f0fdf4</span>
  </div>
</div>
</div>
<div class="t-helper">Background ladder. Prompt-box and form interiors sit on <span class="mono">--bg-sunken (#fafafa)</span>; everything else is white.</div>

</div>
</body>
</html>
