<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style></style>
</head>
<body>
<div class="stage">

<div style="display:flex;align-items:center;gap:10px;padding:10px 14px;background:#fff;border:1px solid #e5e7eb;border-radius:12px;width:260px;">
  <span style="font-family:var(--font-kanji);font-size:20px;color:#111827;line-height:1;letter-spacing:-0.02em;font-weight:500;">時</span>
  <span style="flex:1;font-size:11.5px;color:#6b7280;font-style:italic;letter-spacing:-0.01em;">時間を整理しています...</span>
  <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:#9ca3af;animation:spin 2.5s linear infinite;"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
</div>
<div style="display:flex;align-items:center;gap:8px;padding:6px 4px;">
  <span style="font-family:var(--font-kanji);font-size:18px;color:#111827;font-weight:500;letter-spacing:-0.02em;">時</span>
  <span style="font-size:12.5px;color:#6b7280;letter-spacing:-0.005em;">Harmonizando agendas</span>
  <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:#9ca3af;animation:spin 1.4s linear infinite;"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
</div>
<style>@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}</style>
<div class="t-helper">Loading uses the 時 kanji as a companion mark + an italic, rotated phrase + a clock-style spinner. Phrases rotate from a set of six.</div>

</div>
</body>
</html>
