<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style></style>
</head>
<body>
<div class="stage">

<div class="row" style="gap:18px;padding:14px 0;">
  <div class="col" style="align-items:center;gap:8px;flex:1;">
    <div style="width:120px;height:64px;background:#fff;border:1px solid var(--gray-4);border-radius:9px;box-shadow:0 1px 2px rgba(0,0,0,0.05);"></div>
    <span class="label">tiny · tile</span>
  </div>
  <div class="col" style="align-items:center;gap:8px;flex:1;">
    <div style="width:120px;height:64px;background:#fff;border:1px solid var(--gray-4);border-radius:12px;box-shadow:0 1px 2px rgba(0,0,0,0.04),0 12px 32px rgba(15,23,42,0.10);"></div>
    <span class="label">card · widget</span>
  </div>
  <div class="col" style="align-items:center;gap:8px;flex:1;">
    <div style="width:120px;height:36px;background:var(--ink);color:#fff;border-radius:8px;box-shadow:0 4px 12px rgba(17,24,39,0.15);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500;">Hover</div>
    <span class="label">button · hover</span>
  </div>
  <div class="col" style="align-items:center;gap:8px;flex:1;">
    <div style="width:120px;height:64px;background:#fff;border:1px solid var(--ink);border-radius:8px;box-shadow:0 0 0 4px rgba(17,24,39,0.06);"></div>
    <span class="label">focus ring</span>
  </div>
</div>

</div>
</body>
</html>
