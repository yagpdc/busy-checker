<div class="stage">

<div class="row" style="gap:4px;">
  
    <button style="padding:5px 10px;border:1px solid #d1d5db;border-radius:6px;background:#fff;color:#374151;font:500 12px var(--font-ui);font-variant-numeric:tabular-nums;cursor:pointer;">15m</button>
  
    <button style="padding:5px 10px;border:1px solid #111827;border-radius:6px;background:#111827;color:#fff;font:500 12px var(--font-ui);font-variant-numeric:tabular-nums;cursor:pointer;">30m</button>
  
    <button style="padding:5px 10px;border:1px solid #d1d5db;border-radius:6px;background:#fff;color:#374151;font:500 12px var(--font-ui);font-variant-numeric:tabular-nums;cursor:pointer;">45m</button>
  
    <button style="padding:5px 10px;border:1px solid #d1d5db;border-radius:6px;background:#fff;color:#374151;font:500 12px var(--font-ui);font-variant-numeric:tabular-nums;cursor:pointer;">1h</button>
  
    <button style="padding:5px 10px;border:1px solid #d1d5db;border-radius:6px;background:#fff;color:#374151;font:500 12px var(--font-ui);font-variant-numeric:tabular-nums;cursor:pointer;">1.5h</button>
  
    <button style="padding:5px 10px;border:1px solid #d1d5db;border-radius:6px;background:#fff;color:#374151;font:500 12px var(--font-ui);font-variant-numeric:tabular-nums;cursor:pointer;">2h</button>
  
</div>
<div class="t-helper">Duration chips for the schedule form. Selected = ink fill. Tabular numerals. <span class="mono">30m</span> selected by default; capped by available slot gap.</div>

</div>
