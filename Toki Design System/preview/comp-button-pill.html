<div class="stage">

  <button style="background:#111827;color:#fff;border:1px solid #111827;padding:4px 10px;border-radius:999px;font:500 11px var(--font-ui);cursor:pointer;">Entrar</button>

  <button style="background:#f3f4f6;color:#111827;border:1px solid #d1d5db;padding:5px 10px;border-radius:999px;font:11.5px var(--font-ui);cursor:pointer;">hover</button>
