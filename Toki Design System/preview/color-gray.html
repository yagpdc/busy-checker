<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style></style>
</head>
<body>
<div class="stage">

<div class="row" style="gap:8px;">
  
<div class="swatch" style="flex:1;min-width:120px;">
  <div class="swatch-chip" style="background:#6b7280;border-color:transparent;"></div>
  <div class="swatch-meta">
    <span class="swatch-name">gray-1</span>
    <span class="swatch-hex">#6b7280</span>
  </div>
</div>
  
<div class="swatch" style="flex:1;min-width:120px;">
  <div class="swatch-chip" style="background:#9ca3af;border-color:var(--gray-4);"></div>
  <div class="swatch-meta">
    <span class="swatch-name">gray-2</span>
    <span class="swatch-hex">#9ca3af</span>
  </div>
</div>
  
<div class="swatch" style="flex:1;min-width:120px;">
  <div class="swatch-chip" style="background:#d1d5db;border-color:var(--gray-4);"></div>
  <div class="swatch-meta">
    <span class="swatch-name">gray-3</span>
    <span class="swatch-hex">#d1d5db</span>
  </div>
</div>
  
<div class="swatch" style="flex:1;min-width:120px;">
  <div class="swatch-chip" style="background:#e5e7eb;border-color:var(--gray-4);"></div>
  <div class="swatch-meta">
    <span class="swatch-name">gray-4</span>
    <span class="swatch-hex">#e5e7eb</span>
  </div>
</div>
  
<div class="swatch" style="flex:1;min-width:120px;">
  <div class="swatch-chip" style="background:#f3f4f6;border-color:var(--gray-4);"></div>
  <div class="swatch-meta">
    <span class="swatch-name">gray-5</span>
    <span class="swatch-hex">#f3f4f6</span>
  </div>
</div>
  
<div class="swatch" style="flex:1;min-width:120px;">
  <div class="swatch-chip" style="background:#f9fafb;border-color:var(--gray-4);"></div>
  <div class="swatch-meta">
    <span class="swatch-name">gray-6</span>
    <span class="swatch-hex">#f9fafb</span>
  </div>
</div>
</div>
<div class="t-helper">Tailwind gray, used verbatim. Secondary text → placeholder → control border → hairline → chip fill → subtle surface.</div>

</div>
</body>
</html>
